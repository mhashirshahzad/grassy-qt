name: Windows build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_mingw
          modules: qtshadertools
          cache: true

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          build-cache: true
          build-cache-key: windows-qt683-mingw
          package-cache: true
          package-cache-key: windows-qt683-mingw

      - name: Put Qt's MinGW on PATH
        shell: pwsh
        run: |
          $mingw = Get-ChildItem "$env:QT_ROOT_DIR\..\..\Tools" -Directory |
            Where-Object Name -like 'mingw*' | Select-Object -First 1
          if (-not $mingw) { Write-Error "Qt MinGW toolchain not found"; exit 1 }
          "$($mingw.FullName)\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Configure
        shell: pwsh
        run: |
          xmake f `
            -p windows `
            -a x86_64 `
            -m release `
            --qt="$env:QT_ROOT_DIR" `
            --qt_host="$env:QT_ROOT_DIR" `
            --qt_sdkver=6.8.3

      - name: Build
        shell: pwsh
        run: xmake -v

      - name: Bundle Qt runtime
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter grassy.exe -Recurse | Select-Object -First 1
          if (-not $exe) { Write-Error "grassy.exe not found"; exit 1 }

          New-Item -ItemType Directory -Force dist/grassy-windows | Out-Null

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --qmldir qml `
            --dir dist/grassy-windows `
            $exe.FullName

          # MinGW runtime DLLs (windeployqt doesn't copy these)
          $mingw = Get-ChildItem "$env:QT_ROOT_DIR\..\..\Tools" -Directory |
            Where-Object Name -like 'mingw*' | Select-Object -First 1
          foreach ($dll in 'libgcc_s_seh-1.dll','libstdc++-6.dll','libwinpthread-1.dll') {
            Copy-Item "$($mingw.FullName)\bin\$dll" dist/grassy-windows -Force
          }

          Copy-Item $exe.FullName dist/grassy-windows -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: grassy-windows-x86_64
          path: dist/grassy-windows
